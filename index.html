<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HackBase Merch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>HackBase Merch</h1>
    <p>Official Hackdays 2.0 drops</p>
  </header>

  <main>
    <section id="products"></section>

    <aside id="cart">
      <h2>Your cart</h2>
      <ul id="cart-items"><li class="empty">Nothing here yet</li></ul>

      <form id="coupon-form">
        <input id="coupon" placeholder="Coupon code" autocomplete="off">
        <button type="submit" id="apply">Apply</button>
      </form>
      <p id="coupon-msg"></p>

      <dl>
        <dt>Subtotal</dt><dd id="subtotal">₹0</dd>
        <dt>Discount</dt><dd id="discount">₹0</dd>
        <dt class="total">Total</dt><dd id="total" class="total">₹0</dd>
      </dl>

      <button id="pay" disabled>Pay</button>
      <p id="receipt"></p>
    </aside>
  </main>

  <script src="js/format.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/coupon.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
